# Source registry (guide section 5). Registry fields go to news.sources via `python dev.py sources-sync`;
# adapter fields (adapter, naive_tz, ..., options) are used only by the fetch code.
# Verified 2026-10-20. A source with enabled: false has a disabled_reason; nothing is fetched from it.
defaults:
  default_language: en
  naive_tz: UTC
  circuit_breaker_failures: 3
  circuit_breaker_cooldown_minutes: 360

sources:
  # ── NSE corporate filings (RSS, items carry naive IST timestamps) ──────────
  nse_announcements:
    display_name: NSE - Online announcements
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
    license_note: NSE public RSS; titles/links/summaries only
    enabled: true
    min_interval_minutes: 30
    daily_request_budget: null
    adapter: nse_rss
    naive_tz: Asia/Kolkata
    options: {url: "https://nsearchives.nseindia.com/content/RSS/Online_announcements.xml", feed_name: Online_announcements, feed_kind: announcements}
  nse_results:
    display_name: NSE - Financial results
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
    license_note: NSE public RSS; titles/links/summaries only
    enabled: true
    min_interval_minutes: 30
    daily_request_budget: null
    adapter: nse_rss
    naive_tz: Asia/Kolkata
    default_event_type: earnings
    options: {url: "https://nsearchives.nseindia.com/content/RSS/Financial_Results.xml", feed_name: Financial_Results, feed_kind: results}
  nse_board_meetings:
    display_name: NSE - Board meetings
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
