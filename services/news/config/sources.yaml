    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: nse_rss
    naive_tz: Asia/Kolkata
    default_event_type: board_meeting
    options: {url: "https://nsearchives.nseindia.com/content/RSS/Board_Meetings.xml", feed_name: Board_Meetings, feed_kind: board_meetings}
  nse_corporate_actions:
    display_name: NSE - Corporate actions
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
    license_note: NSE public RSS; titles/links/summaries only
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: nse_rss
    naive_tz: Asia/Kolkata
    default_event_type: dividend_buyback_split
    options: {url: "https://nsearchives.nseindia.com/content/RSS/Corporate_action.xml", feed_name: Corporate_action, feed_kind: corporate_actions}
  nse_insider_trading:
    display_name: NSE - Insider trading
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
    license_note: NSE public RSS; titles/links/summaries only
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: nse_rss
    naive_tz: Asia/Kolkata
    default_event_type: insider_trade
    options: {url: "https://nsearchives.nseindia.com/content/RSS/InsiderTrading.xml", feed_name: InsiderTrading, feed_kind: insider_trading}
  bse_announcements:
    display_name: BSE - Corporate announcements
    tier: A
    reliability: 1.00
    source_type: exchange_filing
    region: india
    domain: financial
    ticker_availability: always
    license_note: "BSE unofficial JSON endpoint. DISABLED: HTTP 403 (Akamai) to scripts, verified 2026-10-20."
    enabled: false
    disabled_reason: "BSE's API answers HTTP 403 (Akamai Access Denied) to scripts; verified 2026-10-20. Adapter kept dormant."
    min_interval_minutes: 30
    daily_request_budget: null
    adapter: bse_announcements
    naive_tz: Asia/Kolkata
    options: {}

  # ── Regulators and government (RSS) ────────────────────────────────────────
  sebi:
    display_name: SEBI - RSS feed
    tier: A
    reliability: 1.00
    source_type: regulator
    region: india
    domain: financial
    ticker_availability: sometimes
    license_note: SEBI public RSS; titles/links/summaries only
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: rss
    naive_tz: Asia/Kolkata
    default_category: government_regulation
    options: {url: "https://www.sebi.gov.in/sebirss.xml"}
  rbi_press:
    display_name: RBI - Press releases
    tier: A
    reliability: 1.00
    source_type: regulator
    region: india
    domain: financial
    ticker_availability: never
    license_note: RBI public RSS; titles/links/summaries only (summary capped at 1000 characters)
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: rss
    naive_tz: Asia/Kolkata
    default_category: central_bank_monetary_policy
    options: {url: "https://rbi.org.in/pressreleases_rss.xml"}
  rbi_notifications:
    display_name: RBI - Notifications
    tier: A
    reliability: 1.00
    source_type: regulator
    region: india
    domain: financial
    ticker_availability: never
    license_note: RBI public RSS; titles/links/summaries only (summary capped at 1000 characters)
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: rss
    naive_tz: Asia/Kolkata
    default_category: central_bank_monetary_policy
    options: {url: "https://rbi.org.in/notifications_rss.xml"}
  pib:
    display_name: PIB - Press Information Bureau
    tier: A
    reliability: 0.95
    source_type: government
    region: india
    domain: mixed
    ticker_availability: never
    license_note: PIB public RSS
    enabled: false
    disabled_reason: "PIB's RSS (RssMain.aspx?ModId=6&Lang=1&Regid=3) has no pubDate on any item and returns Hindi titles; retried with Lang=1 on 2026-10-26 (and Lang=2 earlier): same result. Without a date every item would be rejected as missing_required, and the guide forbids substituting now()."
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: rss
    naive_tz: Asia/Kolkata
    options: {url: "https://www.pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"}
  fed_press:
    display_name: Federal Reserve - Press releases
    tier: A
    reliability: 1.00
    source_type: regulator
    region: global
    domain: financial
    ticker_availability: never
    license_note: Federal Reserve public RSS (US government work)
    enabled: true
    min_interval_minutes: 60
    daily_request_budget: null
    adapter: rss
    default_category: central_bank_monetary_policy
    options: {url: "https://www.federalreserve.gov/feeds/press_all.xml"}

