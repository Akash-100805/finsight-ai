  # ── Aggregators (APIs, free tiers) ─────────────────────────────────────────
  marketaux:
    display_name: Marketaux
    tier: B
    reliability: 0.80
    source_type: aggregator
    region: global
    domain: financial
    ticker_availability: sometimes
    license_note: Marketaux free plan (3 articles per request)
    enabled: true
    min_interval_minutes: 30
    daily_request_budget: 96
    adapter: marketaux
    options:
      limit: 3
      calls:
        - {name: india, params: {countries: in}}
        - {name: global, params: {}}
  finnhub:
    display_name: Finnhub
    tier: B
    reliability: 0.75
    source_type: aggregator
    region: global
    domain: financial
    ticker_availability: sometimes
    license_note: Finnhub free plan
    enabled: true
    min_interval_minutes: 30
    daily_request_budget: null
    adapter: finnhub
    options: {categories: [general, merger]}
  alpha_vantage:
    display_name: Alpha Vantage NEWS_SENTIMENT
    tier: B
    reliability: 0.75
    source_type: aggregator
    region: global
    domain: financial
    ticker_availability: sometimes
    license_note: "Alpha Vantage free key. DISABLED: NEWS_SENTIMENT answers premium-endpoint on the free key, verified 2026-10-20."
    enabled: false
    disabled_reason: "NEWS_SENTIMENT answers 'This is a premium endpoint' on this account's free key (verified 2026-10-20, with and without optional parameters)."
    min_interval_minutes: 60
    daily_request_budget: 20
    adapter: alpha_vantage
    options:
      limit: 50
      topics: [economy_macro, economy_monetary, energy_transportation, financial_markets, technology, mergers_and_acquisitions, earnings]
  newsdata:
    display_name: NewsData.io
    tier: C
    reliability: 0.65
    source_type: aggregator
    region: global
    domain: mixed
    ticker_availability: never
    license_note: NewsData free plan (content and AI fields are paid-only and are discarded)
    enabled: true
    min_interval_minutes: 30
    daily_request_budget: 144
    adapter: newsdata
    options:
      calls:
        - {name: india_business, params: {country: in, category: business}}
        - {name: india_politics_environment_top, params: {country: in, category: "politics,environment,top"}}
        - {name: global_business_world, params: {category: "business,world"}}
  gdelt:
    display_name: GDELT DOC 2.0
    tier: C
    reliability: 0.60
    source_type: event_database
    region: global
    domain: non_financial
    ticker_availability: never
    license_note: GDELT public API (one request per 5 seconds at most; 10 s used)
    enabled: true
    min_interval_minutes: 120
    daily_request_budget: 80
    adapter: gdelt
    options:
      maxrecords: 15
      sort: hybridrel
      inter_query_delay_seconds: 10
      retry_after_429_seconds: 30
      queries:
        - {name: india_policy_macro, scope: india, query: '(RBI OR SEBI OR budget OR GST OR "finance ministry" OR inflation OR GDP OR rupee OR monsoon)'}
        - {name: india_trade_commodities, scope: india, query: '(tariff OR export OR import OR "trade deal" OR coal OR power OR "crude oil" OR steel OR gold)'}
        - {name: india_disasters_politics, scope: india, query: '(flood OR cyclone OR earthquake OR drought OR heatwave OR election OR "Lok Sabha" OR "Supreme Court")'}
        - {name: global_conflict, scope: global, query: '(war OR missile OR airstrike OR ceasefire OR invasion OR coup OR sanctions OR embargo)'}
        - {name: global_oil_trade_central_banks, scope: global, query: '(OPEC OR "oil price" OR Brent OR tariff OR "trade war" OR "Federal Reserve" OR ECB OR "rate hike" OR "rate cut")'}
        - {name: global_disasters_supply_politics, scope: global, query: '(hurricane OR earthquake OR "supply chain" OR "port strike" OR "chip shortage" OR election OR summit)'}
