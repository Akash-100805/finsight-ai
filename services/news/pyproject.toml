[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-data-pipeline"
version = "0.1.0"
description = "FinSight AI ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬ÃƒÂ¢Ã¢â€šÂ¬Ã‚Â News Data Collection and Storage Pipeline"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "wordfreq>=3.1",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "bleach>=6.0",
    "pgvector>=0.2.0",
    "sentence-transformers>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests that need the Neon TEST database (TEST_DATABASE_URL only)",
    "models: sanity checks with the real NER and FinBERT models (run with: python dev.py test -m models)",
    "challenge: hand-written accuracy cases with the real models and the real security master in the TEST database (run with: python dev.py test -m challenge)",
]
addopts = "-m 'not models and not challenge'"
filterwarnings = ["ignore::DeprecationWarning"]
