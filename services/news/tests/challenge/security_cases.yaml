# Challenge set for security resolution (Phase 4.1). Written BEFORE any fix and frozen: expected values are never edited or
# deleted after the baseline run (new cases may be appended, marked "added after baseline").
#
# text:  first line = title, optional rest = description (the runner splits on the first newline).
# For source_type exchange_filing the title is "<Company>: <subject>" and the runner builds the filing record from the part before ':'.
# expected_securities: security_ids that MUST be linked.  forbidden_securities: must NOT be linked.
# allowed_extra: other security_ids that may appear without failing the case.  A case also fails on any link outside
# expected + allowed_extra (a stray extra match is a false positive).
# source_region: india | global | both  (both = an aggregator that covers both markets)
