[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-tkg"
version = "0.1.0"
description = "FinSight AI — Temporal Knowledge Graph (TKG) Component"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "tzdata>=2024.1",
    "finsight-shared",   # local package: pip install -e shared first (the same way services/news and services/agents use it)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: tests that need the Neon TEST database (never main)",
    "llm: real LLM challenge tests (need GEMINI_API_KEY)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E741"]
