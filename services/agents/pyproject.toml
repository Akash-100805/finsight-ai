[project]
name = "finsight-ai"
version = "0.1.0"
description = "FinSight AI - Multi-Agent Stock Attention Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
