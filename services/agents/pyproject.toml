[project]
name = "finsight-ai"
version = "0.2.0"
description = "FinSight AI - Multi-Agent Stock Attention Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pytest>=8.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "yfinance>=0.2.40",
    "google-genai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: read-only tests against the news database through the finsight_agents login (AGENTS_TEST_DATABASE_URL; main if the test DB has no news rows)",
]
